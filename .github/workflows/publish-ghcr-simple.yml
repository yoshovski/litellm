name: Build and verify custom LiteLLM

on:
  push:
    branches: ['custom-v1.*']
    tags: ['v*-custom-v*']

jobs:
  build:
    if: github.repository == 'yoshovski/litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/yoshovski/litellm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve image tag
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          image_tag="$GITHUB_REF_NAME"
          release_tag=""

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ "$COMMIT_MESSAGE" == "release: publish "* ]]; then
            release_tag="${COMMIT_MESSAGE#release: publish }"
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom-v[1-9][0-9]*$ ]]; then
              echo "Expected a release tag such as v1.110.2-custom-v1" >&2
              exit 1
            fi
            if [[ "$GITHUB_REF_NAME" != "custom-${release_tag%-custom-*}" ]]; then
              echo "Release tag must match the version in the branch name" >&2
              exit 1
            fi
            image_tag="$release_tag"
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Build image
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: docker build --build-arg "LITELLM_RELEASE_TAG=$IMAGE_TAG" --tag "$IMAGE:$IMAGE_TAG" .
      - name: Check certificate stores
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          docker run --rm --network none --entrypoint python -i "$IMAGE:$IMAGE_TAG" \
            - --require-certifi < scripts/check_certificate_trust.py
      - name: Check PostgreSQL, model aliases, and Auto Router
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: bash scripts/check_proxy_database.sh "$IMAGE:$IMAGE_TAG"
      - name: Create release tag
        if: github.ref_type == 'branch' && steps.version.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          # A tag from this workflow's token does not trigger another workflow run.
          endpoint="repos/$GITHUB_REPOSITORY/git"
          if existing_sha=$(gh api "$endpoint/ref/tags/$RELEASE_TAG" --jq .object.sha); then
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points at $existing_sha" >&2
              exit 1
            fi
          else
            gh api --method POST "$endpoint/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" --silent
          fi
      - name: Publish verified image
        if: steps.version.outputs.release_tag != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$RELEASE_TAG"
