name: Build and verify custom LiteLLM

on:
  push:
    branches: ['custom-v1.*']
    tags: ['v*-custom-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'yoshovski/litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/yoshovski/litellm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve image tag
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          image_tag="$GITHUB_REF_NAME"
          release_tag=""
          commit_subject="${COMMIT_MESSAGE%%$'\n'*}"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ "$commit_subject" == "release: publish "* ]]; then
            release_tag="${commit_subject#release: publish }"
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom-v[1-9][0-9]*$ ]]; then
              echo "Expected a release tag such as v1.110.2-custom-v1" >&2
              exit 1
            fi
            if [[ "$GITHUB_REF_NAME" != "custom-${release_tag%-custom-*}" ]]; then
              echo "Release tag must match the version in the branch name" >&2
              exit 1
            fi
            image_tag="$release_tag"
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Build image
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          docker build --build-arg "LITELLM_RELEASE_TAG=$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$IMAGE_TAG" .
      - name: Check certificate stores
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          docker run --rm --network none --entrypoint python -i "$IMAGE:$IMAGE_TAG" \
            - --require-certifi < scripts/check_certificate_trust.py
      - name: Check PostgreSQL, model aliases, and Auto Router
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: bash scripts/check_proxy_database.sh "$IMAGE:$IMAGE_TAG"
      - name: Verify release source
        if: steps.version.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          refs=$(git ls-remote origin "$GITHUB_REF" "$tag_ref" "${tag_ref}^{}")
          tag_sha=$(awk -v ref="$tag_ref" '$2 == ref {sha=$1} $2 == ref "^{}" {peeled=$1} END {print (peeled ? peeled : sha)}' <<< "$refs")
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            branch_sha=$(awk -v ref="$GITHUB_REF" '$2 == ref {print $1}' <<< "$refs")
            if [[ "$branch_sha" != "$GITHUB_SHA" ]]; then
              echo "Release branch changed during the build" >&2
              exit 1
            fi
          elif [[ -z "$tag_sha" ]]; then
            echo "Release tag disappeared during the build" >&2
            exit 1
          fi
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag $RELEASE_TAG points at $tag_sha" >&2
            exit 1
          fi
      - name: Publish verified image
        if: steps.version.outputs.release_tag != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$RELEASE_TAG"
